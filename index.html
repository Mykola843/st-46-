<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section — Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; background-color: #f0f2f5; }
    .hero-saas { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: #fff; border-radius: 1rem; padding: 4rem 2rem; }
    .feature-badge { background-color: rgba(255,255,255,0.2); border-radius: .5rem; padding: .4rem .9rem; font-size: .875rem; display: inline-block; }
    .illustration-placeholder { background-color: rgba(255,255,255,.1); border-radius: .75rem; min-height: 320px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); font-size: 1rem; border: 1px dashed rgba(255,255,255,.4); }
  </style>
</head>
<body>
  <div class="container-fluid container-sm mt-5 mb-5">
    <h1 class="text-center mb-5 text-dark">Modern Bootstrap Banners</h1>
    <section class="hero-saas shadow">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-12 col-lg-7 text-center text-lg-start">
            <h2 class="display-4 fw-bold mb-3">Transform Your Ideas into Real Products!</h2>
            <p class="lead mb-4">Our innovative solution provides tools for rapid development, scalability, and success.</p>
            <div class="row g-2 mb-4">
              <div class="col-6 col-md-4"><span class="feature-badge w-100 text-center">Rapid Launch</span></div>
              <div class="col-6 col-md-4"><span class="feature-badge w-100 text-center">Scalability</span></div>
              <div class="col-6 col-md-4"><span class="feature-badge w-100 text-center">Reliable Support</span></div>
            </div>
            <a href="#details" class="btn btn-light btn-lg rounded-pill px-4 shadow">Get Started for Free</a>
          </div>
          <div class="col-12 col-lg-5">
            <div class="illustration-placeholder text-center">Your Illustration Here</div>
          </div>
        </div>
      </div>
    </section>
    <p id="details" class="text-center text-secondary mt-4">Responsive Hero Section built with Bootstrap 5</p>
  </div>
</body>
</html>
